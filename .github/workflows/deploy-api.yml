# Deploys server/ to the Railway service "api" whenever main changes it (or by hand from the Actions tab).
# Needs the repo secret RAILWAY_TOKEN: a project token for the uuumpire project, production environment
# (Railway dashboard -> project Settings -> Tokens). The core tests run first; a red test stops the deploy.
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'core.js'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Core tests (and server/core.cjs is a fresh copy of core.js)
        run: node tools/test-core.js
      - name: Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy server/ to service api
        working-directory: server
        run: railway up --service api --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Health check
        run: |
          sleep 20
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://api-production-c3f4.up.railway.app/health | grep -q '"ok":true'; then exit 0; fi
            sleep 10
          done
          echo "API did not come back healthy" >&2
          exit 1
